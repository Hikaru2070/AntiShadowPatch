# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    outputs:
      mod_version: ${{ steps.version.outputs.mod_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    strategy:
      matrix:
        # Use these Java versions
        java: [
          25,    # Current Java LTS
        ]
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: resolve release version
        id: version
        run: |
          mod_version="$(awk -F= '/^[[:space:]]*mod_version[[:space:]]*=/{gsub(/[[:space:]]*/, "", $2); print $2; exit}' gradle.properties)"
          if [ -z "$mod_version" ]; then
            echo "mod_version is not defined in gradle.properties" >&2
            exit 1
          fi

          if [[ "$mod_version" == v* ]]; then
            tag_name="$mod_version"
          else
            tag_name="v$mod_version"
          fi

          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        if: ${{ matrix.java == '25' }} # Only upload artifacts built from latest java
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

  release:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.build.outputs.tag_name }}
          MOD_VERSION: ${{ needs.build.outputs.mod_version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          assets=(build/libs/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No build artifacts found in build/libs/" >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --title "$TAG_NAME" \
              --target "$TARGET_SHA" \
              --notes "Automated release for version $MOD_VERSION"
          fi
